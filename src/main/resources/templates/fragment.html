<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Fragments</title>
</head>
<body>

<div th:fragment="locale" class="locale-widget">
    <style>
        .locale-widget {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 9999;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        }

        .locale-widget form {
            margin: 0;
            padding: 0;
        }

        .locale-widget select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;

            padding: 9px 36px 9px 14px;
            font-size: 14px;
            font-weight: 500;
            font-family: inherit;
            line-height: 1.2;

            color: #2d3748;
            background-color: #ffffff;

            border: 1px solid #e2e8f0;
            border-radius: 10px;
            cursor: pointer;
            outline: none;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            transition: border-color 0.2s ease,
            box-shadow 0.2s ease,
            transform 0.15s ease;

            background-image: url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%234a5568' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpolyline points='6 9 12 15 18 9'/%3E%3C/svg%3E");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 14px;
        }

        .locale-widget select:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.18);
        }

        .locale-widget select:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.22),
            0 4px 12px rgba(102, 126, 234, 0.15);
        }

        .locale-widget select:active {
            transform: scale(0.98);
        }

        .locale-widget select option {
            padding: 8px;
            background: #ffffff;
            color: #2d3748;
        }
    </style>

    <form action="">
        <select name="lang" onchange="this.form.submit()">
            <option></option>
            <option value="ru" th:selected="${#locale.language == 'ru'}">Ru</option>
            <option value="en" th:selected="${#locale.language == 'en'}">En</option>
        </select>
    </form>
</div>

</body>
</html>
