spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/service_database
    username: postgres
    password: admin
    driver-class-name: org.postgresql.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  jpa:
    properties.hibernate:
      show_sql: true
      format_sql: true
      hbm2ddl.auto: validate

  messages:
    basename: messages
app:
  image:
    bucket: images
  service:
    logging:
      enabled: true